{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Successful</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      text-align: center;
      padding-top: 100px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background-color: #111;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    }
    .btn-custom {
      background-color: red;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none;
    }
    .btn-custom:hover {
      background-color: darkred;
    }
  </style>
  <script>
    setTimeout(function () {
      window.location.href = "{% url 'event:event_list' %}";

    }, 5000);
  </script>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">✅ Password Reset Successful</h2>
    <p>Your password has been successfully changed.</p>
    <p>You will be redirected to the homepage shortly.</p>
    <a href="{% url 'event:event_list' %}" class="btn btn-custom mt-4">Go to Homepage Now</a>

  </div>
</body>
</html>
