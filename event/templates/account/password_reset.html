{% extends "base.html" %}
{% load i18n %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow rounded-4" style="background-color: #121212; color: #fff;">
        <div class="card-body">
          <h4 class="card-title mb-4 text-danger">Reset Your Password</h4>
          <p class="mb-4">Enter your email address below, and we’ll send you a link to reset your password.</p>

          <form method="post" action="{% url 'account_reset_password' %}">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_email" class="form-label">Email address</label>
              <input type="email" name="email" id="id_email" class="form-control rounded-pill" required>
            </div>
            <button type="submit" class="btn btn-danger rounded-pill w-100">Send Reset Link</button>
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'event:event_list' %}" class="text-white">Back to events</a>


          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
