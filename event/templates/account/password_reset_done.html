{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Sent{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card bg-dark text-white shadow-lg p-4 mx-auto" style="max-width: 500px; border-radius: 1rem;">
    <div class="card-body">
      <i class="fa-solid fa-envelope-circle-check fa-3x mb-3 text-danger"></i>
      <h3 class="card-title mb-3">Check Your Email</h3>
      <p class="card-text">We’ve emailed you a link to reset your password. If it doesn’t arrive shortly, be sure to check your spam or junk folder.</p>
      <a href="{% url 'event:event_list' %}"class="btn btn-danger rounded-pill mt-3">Return to Homepage</a>
    </div>
  </div>
</div>
{% endblock %}
