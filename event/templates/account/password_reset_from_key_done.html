{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Reset Complete</title>
  <meta http-equiv="refresh" content="5;url={% url 'account_login' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background-color: #121212;
      border: none;
      color: white;
      padding: 2rem;
      border-radius: 16px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }
    .btn-custom {
      background-color: red;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      margin-top: 20px;
    }
    .btn-custom:hover {
      background-color: darkred;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3 class="mb-4"><i class="fa-solid fa-check-circle text-success me-2"></i> Password Reset Successful</h3>
    <p>Your password has been changed.</p>
    <p class="text-muted" style="font-size: 0.9em;">
      Redirecting to login in <strong id="countdown">5</strong> seconds...
    </p>
    <a href="{% url 'account_login' %}" class="btn btn-custom">Go to Login Now</a>
  </div>

  <script>
    let seconds = 5;
    const countdown = document.getElementById('countdown');

    setInterval(() => {
      seconds--;
      if (seconds > 0) {
        countdown.textContent = seconds;
      }
    }, 1000);
  </script>
</body>
</html>
